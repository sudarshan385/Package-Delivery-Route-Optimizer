


# ============================================
# Server Configuration
# ============================================
server.port=8080

# ============================================
# PostgreSQL Database Configuration
# ============================================
# Database configured explicitly via profiles (dev, test, prod)
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# Flyway Migration Configuration
# ============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================
# JWT Security Configuration
# ============================================
app.jwt.secret=${JWT_SECRET}
# Short-lived access token: 15 minutes (900000 ms)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# ============================================
# Jackson Configuration
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ============================================
# Batch Routing Configuration
# ============================================
delivery.batch.pickup-radius-km=10.0
delivery.batch.delivery-radius-km=10.0
