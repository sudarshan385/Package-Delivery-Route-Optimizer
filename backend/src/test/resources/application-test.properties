spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/route_optimizer_test_db}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.jwt.secret=${JWT_SECRET:test-suite-dedicated-hmac-sha256-signing-key-min-32-bytes}
